        ZIG_VERSION: "0.16.0"
        WASM_BINDGEN_VERSION: "0.2.126"
    cache:
      cache_paths:
        - ~/.cargo/bin
        - ~/.cargo/registry
        - ~/.rustup
        - swift/Examples/WasmerShell/.build
        - js/node_modules
        - wasmer-sh/node_modules
    scripts:
      - name: Submodules
        script: git submodule update --init --recursive
      - name: Verify an Xcode with the iOS 27 simulator SDK
        script: |
          set -euo pipefail
          xcodebuild -version
          CUR="$(xcode-select -p)"
          V="$(DEVELOPER_DIR="$CUR" xcrun --sdk iphonesimulator --show-sdk-version 2>/dev/null || true)"
          if [ -z "$V" ] || [ "${V%%.*}" -lt 27 ]; then
            for CANDIDATE in /Applications/Xcode*.app; do
              DD="$CANDIDATE/Contents/Developer"
              CV="$(DEVELOPER_DIR="$DD" xcrun --sdk iphonesimulator --show-sdk-version 2>/dev/null || true)"
              echo "$CANDIDATE -> iphonesimulator SDK ${CV:-none}"
              if [ -n "$CV" ] && [ "${CV%%.*}" -ge 27 ]; then
                sudo xcode-select -s "$DD"
                V="$CV"
                break
              fi
            done
          fi
          if [ -z "$V" ] || [ "${V%%.*}" -lt 27 ]; then
            echo "ERROR: no Xcode with an iOS 27 simulator SDK on this machine"
            exit 1
          fi
          echo "Using iphonesimulator SDK $V"
      - name: Rust nightly and wasm-bindgen
        script: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "PATH=$HOME/.cargo/bin:$PATH" >> "$CM_ENV"
          if ! command -v rustup >/dev/null 2>&1; then
            curl -sSfL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain nightly -c rust-src -t wasm32-unknown-unknown
          fi
          rustup toolchain install nightly --profile minimal --component rust-src --target wasm32-unknown-unknown --no-self-update
          if ! wasm-bindgen --version 2>/dev/null | grep -qx "wasm-bindgen $WASM_BINDGEN_VERSION"; then
            cargo +nightly install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked --force
          fi
      - name: Install Zig
        script: |
          set -euo pipefail
          ZIG_URL="$(curl -fsSL --connect-timeout 20 --retry 3 https://ziglang.org/download/index.json | python3 -c "import json,sys; print(json.load(sys.stdin)['${ZIG_VERSION}']['aarch64-macos']['tarball'])")"
          echo "Zig tarball: $ZIG_URL"
          curl -fSL --connect-timeout 20 --retry 5 --retry-delay 5 --retry-all-errors --speed-limit 10240 --speed-time 60 "$ZIG_URL" -o "$CM_BUILD_DIR/zig.tar.xz"
          test "$(stat -f%z "$CM_BUILD_DIR/zig.tar.xz")" -gt 40000000
          mkdir -p "$CM_BUILD_DIR/zig"
          tar -xf "$CM_BUILD_DIR/zig.tar.xz" -C "$CM_BUILD_DIR/zig"
          ZIGDIR="$(echo "$CM_BUILD_DIR/zig"/zig-*)"
          echo "PATH=$ZIGDIR:$PATH" >> "$CM_ENV"
          "$ZIGDIR/zig" version
      - name: JS dependencies (sdk and wasmer-sh)
        script: |
          set -euo pipefail
          (cd js && npm ci)
          (cd wasmer-sh && npm ci)
      - name: Prepare WebKit runtime assets
        script: |
          set -euo pipefail
          python3 swift/WasmerWKSDK/scripts/prototype.py prepare --rebuild-wasm
      - name: Strip macOS-only FFI binary target (avoids keychain lookup on CI)
        script: |
          set -euo pipefail
          python3 - <<'EOF'
          import re, pathlib
          p = pathlib.Path("Package.swift")
          s = p.read_text()
          s = re.sub(r"\n\s*\.binaryTarget\(name: \"WasmerSDKFFI\"[^)]*\),", "", s, count=1)
          s = s.replace("dependencies: [.target(name: \"WasmerSDKFFI\", condition: .when(platforms: [.macOS]))],", "dependencies: [],")
          assert "WasmerSDKFFI" not in s, "FFI strip failed - Package.swift changed upstream"
          p.write_text(s)
          print("stripped WasmerSDKFFI binary target (macOS-only, unused for iOS builds)")
          EOF
      - name: Run the headless Pi integration test
        script: |
          set -euo pipefail
          node swift/Examples/WasmerShell/Tests/pi.mjs
    artifacts:
      - swift/Examples/WasmerShell/Artifacts/terminal-result.json
